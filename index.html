    const Section = ({ id, children, className = "" }) => {
      const ref = useRef(null);
      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('opacity-100', 'translate-y-0');
            entry.target.classList.remove('opacity-0', 'translate-y-10');
          }
        }, { threshold: 0.1 });
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);
      return <section id={id} ref={ref} className={`py-20 opacity-0 translate-y-10 transition-all duration-1000 ease-out ${className}`}>{children}</section>;
    };

    const AnimatedCounter = ({ end, label, suffix = "+" }) => {
      const [count, setCount] = useState(0);
      const ref = useRef(null);
      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) {
            let start = 0;
            const timer = setInterval(() => {
              start += 1; setCount(start);
              if (start === end) clearInterval(timer);
            }, 2000 / end);
            observer.unobserve(entry.target);
          }
        }, { threshold: 0.5 });
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, [end]);
      return (
        <div ref={ref} className="text-center p-6 bg-white rounded-2xl shadow-sm border border-brand-pink/20">
          <div className="text-4xl md:text-5xl font-display font-bold text-brand-coral mb-2">{count}{suffix}</div>
          <div className="text-brand-muted font-medium text-sm md:text-base">{label}</div>
        </div>
      );
